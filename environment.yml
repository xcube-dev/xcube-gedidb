name: xcube-gedidb
channels:
  - conda-forge
  - defaults
dependencies:
  # Required
  # gedidb currently cannot be imported with Python 3.14 (Numba caching).
  # This also matches the versions tested in CI.
  - python>=3.10,<3.14
  - xarray
  - xcube
  - pip
  - gdal
  - pip:
      - gedidb
  # for testing
  - black
  - flake8
  - pytest
  - pytest-cov
  - pytest-recording
